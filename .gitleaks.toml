title = "Etaye secret scanning: defaults plus verified public metadata"

[extend]
useDefault = true

[[allowlists]]
description = "Public Figma file identifier, not the REST authentication token"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(docs/design/figma/(manifest|resolved-tokens)\.json|tools/inspect_figma\.py)$''']
regexes = ['''^vfh4BSnbRAbaDE1q0CyssL$''']

