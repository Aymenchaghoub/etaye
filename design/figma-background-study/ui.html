<!doctype html><html lang="fr"><meta charset="utf-8"><style>body{font:14px/1.5 system-ui;padding:16px;color:#1b1b18;background:#efeeea}button,input{font:inherit;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Étude du fond papier + blueprint</h1>
<p>Crée une nouvelle section de calques modifiables dans la page dédiée « Étaye — Fond papier (étude) ». Aucun calque existant n’est modifié ; les couleurs viennent des variables du fichier. Étude à revoir, aucune approbation.</p>
<label for="file">Choisir le lot JSON (background-study-v1.json)</label><br><input id="file" type="file" accept=".json"><br>
<button id="import" disabled>Créer l’étude</button> <button id="cancel">Arrêter</button> <a id="evidence" hidden>Télécharger les références réelles</a>
<pre id="status" role="status"></pre>
<script>
let data;const status=document.getElementById('status'),button=document.getElementById('import');
document.getElementById('file').onchange=async event=>{try{data=JSON.parse(await event.target.files[0].text());button.disabled=false;status.textContent=data.frames.length+' écrans · '+data.sourceSha256;}catch{data=null;button.disabled=true;status.textContent='Lot illisible.';}};
const clearEvidence=()=>{const link=document.getElementById('evidence');link.hidden=true;if(link.hasAttribute('href'))URL.revokeObjectURL(link.href);link.removeAttribute('href');};
button.onclick=()=>{button.disabled=true;clearEvidence();parent.postMessage({pluginMessage:{type:'import',data}},'*');};
document.getElementById('cancel').onclick=()=>{clearEvidence();parent.postMessage({pluginMessage:{type:'cancel'}},'*');};
onmessage=event=>{if(event.source!==parent)return;const m=event.data.pluginMessage;if(!m||typeof m.message!=='string')return;status.textContent=m.message;if(m.done)button.disabled=false;if(m.evidence){const link=document.getElementById('evidence');link.href=URL.createObjectURL(new Blob([JSON.stringify(m.evidence,null,1)],{type:'application/json'}));link.download='background-study-evidence.json';link.textContent='Télécharger les références réelles';link.hidden=false;}};
</script></html>
