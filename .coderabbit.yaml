# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Be concise and evidence-based. Distinguish verified defects, proposals, and missing evidence. Preserve French product copy."
early_access: false
enable_free_tier: true
reviews:
  profile: assertive
  auto_approvals:
    enabled: false
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_apply_labels: false
  auto_assign_reviewers: false
  path_filters:
    - "!_bmad/**"
    - "!.claude/skills/**"
    - "!docs/design/figma/file-snapshot.json"
    - "!docs/design/figma/assets/**"
    - "!docs/test-artifacts/story-10-1-screenshots/**"
    # Story 3.1: static design specimens, running-UI comparison sheets and the generated client are
    # evidence or generated code; the review keeps the PR under its 100-file limit on the code,
    # tests, contract, migration, workflow and decision records.
    - "!docs/design/reviews/2026-11-23-story-3-1-specimens/**"
    - "!docs/design/reviews/2026-11-23-story-3-1-runtime/**"
    # Story 3.2: the same exclusion for its 26 static specimens and its running-UI comparison sheets.
    - "!docs/design/reviews/2026-11-24-story-3-2-specimens/**"
    - "!docs/design/reviews/2026-11-24-story-3-2-runtime/**"
    - "!apps/web/src/api/generated/**"
    - "!pnpm-lock.yaml"
    - "!apps/api/mvnw"
    - "!apps/api/mvnw.cmd"
    - "!apps/api/.mvn/**"
    - "!.gitattributes"
    - "!tsconfig.json"
    - "!tsconfig.base.json"
    - "!pnpm-workspace.yaml"
    - "!apps/web/index.html"
    - "!apps/web/tsconfig.json"
  path_instructions:
    - path: "**"
      instructions: >-
        Read AGENTS.md as the shared policy. Verify the story's authorization in
        _bmad/custom/config.toml and its scope in docs/planning-artifacts/decisions-assumptions.md.
        Review silent failures, edge cases and acceptance-criteria compliance with concrete file
        references. Limit implementation recommendations to the authorized scope and preserve
        the existing identity. Report documentary checks and application tests separately.
    - path: "apps/api/**"
      instructions: >-
        Check tenant isolation first: every query and write must run in a practice-scoped
        transaction under row-level security, and a route practiceId is never authorization.
        Look for swallowed exceptions, leaked context across pooled connections, idempotency
        races, error responses or logs that expose identifiers or SQL, and tests that would
        still pass on a broken implementation.
    - path: "docs/**"
      instructions: >-
        Follow the authoritative definitions linked from docs/README.md. Check consistency
        of permissions, practice ownership, source provenance, lifecycles, patient publication
        and design coverage. Distinguish proposed targets from measured results and actual
        user approval. Report contradictions rather than duplicating specifications.
  auto_review:
    enabled: true
    drafts: false
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
  post_merge_actions: []
  pre_merge_checks:
    docstrings:
      mode: "off"
