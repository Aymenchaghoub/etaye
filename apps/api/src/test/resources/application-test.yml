spring:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: spring_session
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
