spring:
  application:
    name: etaye-api
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

etaye:
  identity:
    datasource:
      username: ${ETAYE_IDENTITY_USER:etaye_identity}
      password: ${ETAYE_IDENTITY_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
