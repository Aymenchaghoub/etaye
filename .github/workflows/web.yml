name: Web

on:
  # No path filter: "Web verify" is a required check (D-40), and a required check that never starts blocks
  # every documentation-only pull request. The job always starts and reports; tools/ci_scope.py decides
  # whether its heavy steps run, for pull requests and for pushes to main alike.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # A newer push to a pull request supersedes the older run; never cancel the verification of a merge to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Web verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit and its first parent (the base tip) are enough to list the changed files.
          fetch-depth: 2
      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Fail closed: an unknown path, a failed diff or a manual run verifies everything.
        run: python3 tools/ci_scope.py --scope web --event "$EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install Corepack (no longer bundled with Node 26), enable it and install locked dependencies
        id: dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: |
          bash tools/install_corepack.sh
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint (correctness, security, accessibility)
        if: steps.changes.outputs.relevant == 'true'
        # New violations fail; the recorded ones live in apps/web/eslint-suppressions.json.
        working-directory: apps/web
        run: pnpm lint
      - name: Check workspace types
        if: steps.changes.outputs.relevant == 'true'
        run: PATH="$PWD/apps/web/node_modules/.bin:$PATH" pnpm exec tsc -b
      - name: Build web
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/web
        run: pnpm build
      - name: Install Playwright Chromium
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke tests with stubbed API responses
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/apps/web/playwright-report/smoke.json
        run: pnpm test:smoke --reporter=json
      - name: Verify Playwright test counts
        if: steps.changes.outputs.relevant == 'true'
        # Raise the minimum whenever the suite grows.
        run: >-
          python3 tools/assert_test_reports.py playwright apps/web/playwright-report/smoke.json --min-tests 206
          --require-file tests/stubbed-probe.spec.ts
          --require-file tests/account-access.spec.ts
          --require-file tests/invitation-access.spec.ts
          --require-file tests/practice-context.spec.ts
          --require-file tests/demo.spec.ts
          --require-file tests/isolation.spec.ts
          --require-file tests/record.spec.ts
          --require-file tests/measurements.spec.ts
      - name: Upload Playwright and axe evidence
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-report
          path: apps/web/playwright-report/smoke.json
          retention-days: 7
      - name: Upload Playwright traces of failed tests
        # The stubbed suite uses synthetic data only. A trace holds the DOM, the stubbed requests and the console.
        if: failure() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run Web unit tests with coverage
        id: unit-tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm test:coverage --reporter=json --outputFile=reports/unit-tests.json
      - name: Verify Web coverage report
        id: unit-coverage
        if: ${{ !cancelled() && steps.unit-tests.outcome == 'success' }}
        run: |
          python3 tools/assert_test_reports.py vitest apps/web/reports/unit-tests.json --min-tests 102 --require-file src/auth/session-work.test.ts --require-file src/isolation/isolation-journey.test.ts --require-file src/record/evidence.test.ts --require-file src/record/asof.test.ts --require-file src/record/measurements.test.ts --require-file src/record/zone.test.ts
          python3 tools/assert_coverage_reports.py lcov apps/web/reports/unit-coverage/lcov.info
      - name: Gate coverage of the changed Web logic lines
        if: github.event_name == 'pull_request' && steps.unit-coverage.outcome == 'success'
        # Logic modules (.ts) only: the page and component files (.tsx) are driven by the browser suite, which
        # collects no coverage, so they have no line measure to gate. Also left out: the browser entry points
        # (src/api/browser.ts, src/demo/**), which only a running page executes. See
        # docs/operations/ci-cd-quality-audit.md. Hooks in .ts files stay in: extract their logic to test it.
        run: >-
          python3 tools/assert_changed_line_coverage.py lcov apps/web/reports/unit-coverage/lcov.info
          --prefix apps/web/ --include 'apps/web/src/**/*.ts' --exclude 'apps/web/src/**/*.test.ts'
          --exclude 'apps/web/src/api/generated/**' --exclude 'apps/web/src/**/*.d.ts'
          --exclude 'apps/web/src/api/browser.ts' --exclude 'apps/web/src/demo/**' --min-percent 80
      - name: Upload Web unit coverage
        # Also when a coverage floor failed the run: the report shows which lines to cover.
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-unit-coverage
          path: |
            apps/web/reports/unit-coverage/
            apps/web/reports/unit-tests.json
          if-no-files-found: warn
          retention-days: 7
