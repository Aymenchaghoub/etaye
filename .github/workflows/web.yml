name: Web

on:
  # No path filter on pull requests: "Web verify" is a required check (D-40), and a required check that
  # never starts blocks every documentation-only pull request. The job always runs and reports; its
  # heavy steps run only when a relevant path changed.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - 'docs/contracts/openapi.yaml'
      - 'docs/references/hey-api-license.md'
      - 'design/tokens/adr-014.json'
      - 'design/received/2026-11-03/design-system/tokens.json'
      - 'design/received/2026-11-03/export/etaye-design-system/tokens/tokens.css'
      - 'design/received/2026-11-03/export/etaye-design-system/fonts/**'
      - 'design/received/2026-11-03/licenses/*-OFL.txt'
      - 'design/received/2026-11-03/licenses/Lucide-LICENSE.txt'
      - 'design/offline-reference/site/logos/**'
      - 'tools/fixtures/etaye-tokens.golden.css'
      - 'tools/generate_web_tokens.py'
      - 'tools/test_generate_web_tokens.py'
      - 'tools/assert_test_reports.py'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit and its first parent (the base tip) are enough to list the changed files.
          fetch-depth: 2
      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Fail closed: anything unexpected runs the full verification.
          relevant=true
          if [ "$EVENT_NAME" = "pull_request" ] &&
              git diff --quiet HEAD^1 HEAD -- apps/web/ package.json pnpm-workspace.yaml pnpm-lock.yaml tsconfig.json tsconfig.base.json \
                docs/contracts/openapi.yaml docs/references/hey-api-license.md design/tokens/adr-014.json \
                design/received/2026-11-03/design-system/tokens.json \
                design/received/2026-11-03/export/etaye-design-system/tokens/tokens.css \
                design/received/2026-11-03/export/etaye-design-system/fonts/ \
                'design/received/2026-11-03/licenses/*-OFL.txt' \
                design/received/2026-11-03/licenses/Lucide-LICENSE.txt design/offline-reference/site/logos/ \
                tools/fixtures/etaye-tokens.golden.css tools/generate_web_tokens.py tools/test_generate_web_tokens.py \
                tools/assert_test_reports.py .github/workflows/web.yml; then
            relevant=false
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Full web verification needed: $relevant"
      - if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install Corepack (no longer bundled with Node 26), enable it and install locked dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check workspace types
        if: steps.changes.outputs.relevant == 'true'
        run: PATH="$PWD/apps/web/node_modules/.bin:$PATH" pnpm exec tsc -b
      - name: Build web
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/web
        run: pnpm build
      - name: Install Playwright Chromium
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke tests with stubbed API responses
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/apps/web/playwright-report/smoke.json
        run: pnpm test:smoke --reporter=json
      - name: Verify Playwright test counts
        if: steps.changes.outputs.relevant == 'true'
        # Raise the minimum whenever the suite grows.
        run: >-
          python3 tools/assert_test_reports.py playwright apps/web/playwright-report/smoke.json --min-tests 56
          --require-file tests/stubbed-probe.spec.ts
          --require-file tests/account-access.spec.ts
          --require-file tests/invitation-access.spec.ts
          --require-file tests/practice-context.spec.ts
          --require-file tests/demo.spec.ts
      - name: Upload Playwright and axe evidence
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-report
          path: apps/web/playwright-report/smoke.json
          retention-days: 7
