name: Web

on:
  # No path filter: "Web verify" is a required check (D-40), and a required check that never starts blocks
  # every documentation-only pull request. The job always starts and reports; tools/ci_scope.py decides
  # whether its heavy steps run, for pull requests and for pushes to main alike.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull request runs share a group per pull request and a newer push supersedes the older run. A run for a push to
  # main, a schedule or a manual start gets a group of its own: concurrency keeps only one pending run per group, so
  # a shared group would silently drop the verification of a merge when two more arrive.
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Web verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit and its first parent (the base tip) are enough to list the changed files.
          fetch-depth: 2
      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Fail closed: an unknown path, a failed diff or a manual run verifies everything.
        run: python3 tools/ci_scope.py --scope web --event "$EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install Corepack (no longer bundled with Node 26), enable it and install locked dependencies
        id: dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: |
          bash tools/install_corepack.sh
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint (correctness, security, accessibility)
        if: steps.changes.outputs.relevant == 'true'
        # New violations fail; the recorded ones live in apps/web/eslint-suppressions.json.
        working-directory: apps/web
        run: |
          report="$RUNNER_TEMP/eslint.json"
          if ! pnpm lint --format json --output-file "$report"; then
            if [[ -f "$report" ]]; then cat "$report"; fi
            exit 1
          fi
          base=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then base=(--base HEAD^1); fi
          python3 ../../tools/check_quality_debt.py eslint "$report" "${base[@]}"
      - name: Check workspace types
        if: steps.changes.outputs.relevant == 'true'
        run: PATH="$PWD/apps/web/node_modules/.bin:$PATH" pnpm exec tsc -b
      - name: Build web
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/web
        run: pnpm build
      - name: Install Playwright Chromium
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke tests with stubbed API responses
        id: smoke
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/apps/web/playwright-report/smoke.json
        run: |
          rm -rf reports/smoke-coverage reports/combined-coverage
          pnpm test:smoke:coverage --reporter=json
      - name: Verify Playwright test counts
        if: steps.changes.outputs.relevant == 'true'
        # Raise the minimum whenever the suite grows.
        run: >-
          python3 tools/assert_test_reports.py playwright apps/web/playwright-report/smoke.json --min-tests 206
          --require-file tests/stubbed-probe.spec.ts
          --require-file tests/account-access.spec.ts
          --require-file tests/invitation-access.spec.ts
          --require-file tests/practice-context.spec.ts
          --require-file tests/demo.spec.ts
          --require-file tests/isolation.spec.ts
          --require-file tests/record.spec.ts
          --require-file tests/measurements.spec.ts
      - name: Upload Playwright and axe evidence
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-report
          path: apps/web/playwright-report/smoke.json
          retention-days: 7
      - name: Rerun the failed browser tests with traces (diagnostics only)
        # Recording a trace on every test cost about 50 s (35 %) of the suite, so only the failed tests rerun with one.
        # The job stays failed whatever this step reports: it exists to produce evidence, never to pass a flake.
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: apps/web
        run: |
          if pnpm test:smoke --last-failed --trace on --reporter=line; then
            echo "::warning::The failed browser tests passed when rerun for diagnostics: the original failure is a flake to investigate, not a pass."
          fi
      - name: Upload Playwright traces of failed tests
        # The stubbed suite uses synthetic data only. A trace holds the DOM, the stubbed requests and the console.
        if: failure() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run Web unit tests with coverage
        id: unit-tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: |
          rm -rf reports/unit-coverage reports/unit-only-coverage reports/component-coverage reports/combined-coverage
          rm -f reports/unit-tests.json
          git rev-parse HEAD > "$RUNNER_TEMP/web-coverage-started"
          pnpm test:coverage --reporter=json --outputFile=reports/unit-tests.json
          pnpm test:unit:coverage
          pnpm test:components:coverage
          if [[ -f reports/smoke-coverage/coverage-final.json ]]; then
            pnpm coverage:merge
          fi
      - name: Verify Web coverage report
        id: unit-coverage
        if: ${{ !cancelled() && steps.unit-tests.outcome == 'success' }}
        run: |
          python3 tools/assert_test_reports.py vitest apps/web/reports/unit-tests.json --min-tests 163 --require-file src/auth/access-contexts.test.ts --require-file src/auth/session-work.test.ts --require-file src/isolation/isolation-journey.test.ts --require-file src/record/evidence.test.ts --require-file src/record/asof.test.ts --require-file src/record/measurements.test.ts --require-file src/record/zone.test.ts --require-file src/auth/SignIn.test.tsx --require-file src/auth/Recovery.test.tsx --require-file src/auth/PracticeSwitchDialog.test.tsx --require-file src/patients/contact-email.test.ts --require-file src/auth/AuthApp.test.tsx --require-file src/auth/Invitation.test.tsx --require-file src/demo/DemoShowcase.test.tsx --require-file src/patients/PatientForm.test.tsx --require-file src/patients/PractitionerShell.test.tsx --require-file src/record/RecordEdges.test.tsx
          python3 tools/assert_coverage_reports.py lcov apps/web/reports/unit-coverage/lcov.info
          python3 tools/assert_coverage_reports.py lcov apps/web/reports/unit-only-coverage/lcov.info
          python3 tools/assert_coverage_reports.py lcov apps/web/reports/component-coverage/lcov.info
          if [[ -f apps/web/reports/combined-coverage/lcov.info ]]; then
            python3 tools/assert_coverage_reports.py lcov apps/web/reports/smoke-coverage/lcov.info
            python3 tools/assert_coverage_reports.py lcov apps/web/reports/combined-coverage/lcov.info
          fi
      - name: Gate coverage of the changed Web logic lines
        if: github.event_name == 'pull_request' && steps.unit-coverage.outcome == 'success'
        # Keep the existing logic-only scope while PR #84 is reviewed separately. The combined report adds browser journeys
        # so edited modules also reflect Playwright coverage when available.
        run: >-
          python3 tools/assert_changed_line_coverage.py lcov apps/web/reports/unit-coverage/lcov.info
          --prefix apps/web/ --include 'apps/web/src/**/*.ts' --exclude 'apps/web/src/**/*.test.ts'
          --exclude 'apps/web/src/api/generated/**' --exclude 'apps/web/src/**/*.d.ts'
          --exclude 'apps/web/src/api/browser.ts' --exclude 'apps/web/src/demo/**' --min-percent 80
          --started "$RUNNER_TEMP/web-coverage-started"
          --line-map apps/web/reports/unit-coverage/coverage-final.json
      - name: Upload Web unit coverage
        # Also when a coverage floor failed the run: the report shows which lines to cover.
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-unit-coverage
          path: |
            apps/web/reports/unit-coverage/
            apps/web/reports/unit-only-coverage/
            apps/web/reports/component-coverage/
            apps/web/reports/smoke-coverage/
            apps/web/reports/combined-coverage/
            apps/web/reports/unit-tests.json
          if-no-files-found: warn
          retention-days: 7
