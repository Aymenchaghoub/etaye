name: Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - 'tools/assert_test_reports.py'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - 'tools/assert_test_reports.py'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Enable Corepack and install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check workspace types
        run: PATH="$PWD/apps/web/node_modules/.bin:$PATH" pnpm exec tsc -b
      - name: Build web
        working-directory: apps/web
        run: pnpm build
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke tests with a stubbed probe
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/apps/web/playwright-report/smoke.json
        run: pnpm test:smoke --reporter=json
      - name: Verify Playwright test counts
        # Raise the minimum whenever the suite grows.
        run: >-
          python3 tools/assert_test_reports.py playwright apps/web/playwright-report/smoke.json --min-tests 9
          --require-file tests/stubbed-probe.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-report
          path: apps/web/playwright-report/smoke.json
          retention-days: 7
