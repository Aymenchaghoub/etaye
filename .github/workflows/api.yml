name: API

on:
  # No path filter: "API verify" is a required check (D-40), and a required check that never starts blocks
  # every documentation-only pull request. The job always starts and reports; tools/ci_scope.py decides
  # whether its heavy steps run, for pull requests and for pushes to main alike.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull request runs share a group per pull request and a newer push supersedes the older run. A run for a push to
  # main, a schedule or a manual start gets a group of its own: concurrency keeps only one pending run per group, so
  # a shared group would silently drop the verification of a merge when two more arrive.
  group: api-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: API verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit and its first parent (the base tip) are enough to list the changed files.
          fetch-depth: 2
      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Fail closed: an unknown path, a failed diff or a manual run verifies everything.
        run: python3 tools/ci_scope.py --scope api --event "$EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check compiler debt
        if: steps.changes.outputs.relevant == 'true'
        run: |
          report="$RUNNER_TEMP/compiler-debt.log"
          if ! (cd apps/api && ./mvnw -B -ntp -Dstyle.color=never -Pcompiler-debt clean test-compile) > "$report" 2>&1; then
            cat "$report"
            exit 1
          fi
          base=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then base=(--base HEAD^1); fi
          python3 tools/check_quality_debt.py javac "$report" "${base[@]}"
      - name: Verify API with Testcontainers
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/api
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/api-coverage-started"
          ./mvnw -B -ntp clean verify
      - name: Verify Surefire test counts
        if: steps.changes.outputs.relevant == 'true'
        # Raise the minimum whenever the suite grows.
        run: >-
          python3 tools/assert_test_reports.py surefire apps/api/target/surefire-reports --min-tests 306
          --require-suite dev.aymen.etaye.ArchitectureTest
          --require-suite dev.aymen.etaye.identity.IdentityLookupTest
          --require-suite dev.aymen.etaye.identity.recovery.LocalRecoveryInboxTest
          --require-suite dev.aymen.etaye.security.AccountAccessHttpTest
          --require-suite dev.aymen.etaye.security.InvitationAccessHttpTest
          --require-suite dev.aymen.etaye.infrastructure.security.AccountRequestBudgetTest
          --require-suite dev.aymen.etaye.security.SecurityIntegrationTest
          --require-suite dev.aymen.etaye.security.SecurityStartupLoggingTest
          --require-suite dev.aymen.etaye.PracticeIsolationTest
          --require-suite dev.aymen.etaye.records.PatientCarrierOperationsHttpTest
          --require-suite dev.aymen.etaye.records.HttpConnectionReuseIsolationTest
          --require-suite dev.aymen.etaye.records.CarrierRouteOutageTest
          --require-suite dev.aymen.etaye.infrastructure.transaction.PracticeTransactionTest
          --require-suite dev.aymen.etaye.infrastructure.transaction.PracticeTransactionSuspensionTest
          --require-suite dev.aymen.etaye.infrastructure.web.ReadinessProbeOutageTest
          --require-suite dev.aymen.etaye.infrastructure.error.DatabaseUnavailableTest
          --require-suite dev.aymen.etaye.infrastructure.error.ProblemResponseWriterTest
          --require-suite dev.aymen.etaye.infrastructure.error.DatabaseUnavailableFilterTest
          --require-suite dev.aymen.etaye.infrastructure.idempotency.IdempotencyServiceTest
          --require-suite dev.aymen.etaye.security.CsrfRevocationFailureTest
          --require-suite dev.aymen.etaye.infrastructure.security.AccessDenialRateLimiterTest
          --require-suite dev.aymen.etaye.security.AllowedOriginHttpTest
          --require-suite dev.aymen.etaye.communications.push.PushNotificationsTest
          --require-suite dev.aymen.etaye.infrastructure.security.BrowserCorsConfigTest
          --require-suite dev.aymen.etaye.infrastructure.web.ApiMetaControllerTest
          --require-suite dev.aymen.etaye.infrastructure.demo.DemoHttpTest
          --require-suite dev.aymen.etaye.infrastructure.demo.DemoFixtureManagedTest
          --require-suite dev.aymen.etaye.isolation.ResourceIsolationMatrixHttpTest
          --require-suite dev.aymen.etaye.records.PatientSearchAndRegistrationHttpTest
          --require-suite dev.aymen.etaye.records.PatientSearchMigrationTest
          --require-suite dev.aymen.etaye.infrastructure.demo.DemoPatientInputHttpTest
          --require-suite dev.aymen.etaye.records.PatientCorrectionAtomicityHttpTest
          --require-suite dev.aymen.etaye.records.PatientRegistrationRaceHttpTest
          --require-suite dev.aymen.etaye.records.SectionStateRuleTest
          --require-suite dev.aymen.etaye.records.RecordEvidenceFixtureHttpTest
          --require-suite dev.aymen.etaye.records.RecordEvidenceHttpTest
          --require-suite dev.aymen.etaye.records.RecordEvidenceMigrationTest
          --require-suite dev.aymen.etaye.records.MeasurementFixtureHttpTest
          --require-suite dev.aymen.etaye.records.LabResultHttpTest
          --require-suite dev.aymen.etaye.records.MeasurementHttpTest
          --require-suite dev.aymen.etaye.records.MeasurementMigrationTest
      - name: Verify isolation matrix report
        if: steps.changes.outputs.relevant == 'true'
        # Fails for a zero-case report, a missing, skipped or failing mandatory case, refusals that differ,
        # or any identifier in the report (story 1.4, UD-33). Pending rows stay listed until their routes ship (D-55).
        run: >-
          python3 tools/assert_isolation_matrix.py apps/api/target/isolation-matrix/isolation-matrix.json
          --manifest apps/api/src/test/resources/isolation/matrix-cases.json --require-commit
          --expect-commit "$GITHUB_SHA"
      - name: Summarize isolation matrix
        if: steps.changes.outputs.relevant == 'true'
        run: cat apps/api/target/isolation-matrix/isolation-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload isolation matrix
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-isolation-matrix
          path: apps/api/target/isolation-matrix/
          if-no-files-found: error
          retention-days: 30
      - name: Verify API coverage report
        if: steps.changes.outputs.relevant == 'true'
        # Integrity only: the coverage floors are enforced by the JaCoCo `check` goal of `mvnw verify` (pom.xml),
        # so the same rules fail a local build and this one.
        run: python3 tools/assert_coverage_reports.py jacoco apps/api/target/site/jacoco/jacoco.xml
      - name: Gate coverage of the changed API lines
        if: github.event_name == 'pull_request' && steps.changes.outputs.relevant == 'true'
        # At least 80 % of the executable lines that this pull request adds or modifies must run in the suite.
        run: >-
          python3 tools/assert_changed_line_coverage.py jacoco apps/api/target/site/jacoco/jacoco.xml
          --prefix apps/api/src/main/java/ --include 'apps/api/src/main/java/**/*.java' --min-percent 80
          --started "$RUNNER_TEMP/api-coverage-started"
      - name: Upload API coverage
        # Also when a coverage floor failed the build: the report shows which lines to cover.
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage
          path: apps/api/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Surefire reports
        if: failure() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-surefire-reports
          path: apps/api/target/surefire-reports/
          retention-days: 7
