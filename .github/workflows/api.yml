name: API

on:
  # No path filter on pull requests: "API verify" is a required check (D-40), and a required check that
  # never starts blocks every documentation-only pull request. The job always runs and reports; its
  # heavy steps run only when a relevant path changed.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'tools/assert_test_reports.py'
      - '.github/workflows/api.yml'

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: API verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit and its first parent (the base tip) are enough to list the changed files.
          fetch-depth: 2
      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Fail closed: anything unexpected runs the full verification.
          relevant=true
          if [ "$EVENT_NAME" = "pull_request" ] &&
              git diff --quiet HEAD^1 HEAD -- apps/api/ tools/assert_test_reports.py .github/workflows/api.yml; then
            relevant=false
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Full API verification needed: $relevant"
      - if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify API with Testcontainers
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/api
        run: ./mvnw -B -ntp verify
      - name: Verify Surefire test counts
        if: steps.changes.outputs.relevant == 'true'
        # Raise the minimum whenever the suite grows.
        run: >-
          python3 tools/assert_test_reports.py surefire apps/api/target/surefire-reports --min-tests 143
          --require-suite dev.aymen.etaye.ArchitectureTest
          --require-suite dev.aymen.etaye.identity.IdentityLookupTest
          --require-suite dev.aymen.etaye.security.SecurityIntegrationTest
          --require-suite dev.aymen.etaye.security.SecurityStartupLoggingTest
          --require-suite dev.aymen.etaye.PracticeIsolationTest
          --require-suite dev.aymen.etaye.records.PatientCarrierOperationsHttpTest
          --require-suite dev.aymen.etaye.records.HttpConnectionReuseIsolationTest
          --require-suite dev.aymen.etaye.records.CarrierRouteOutageTest
          --require-suite dev.aymen.etaye.infrastructure.transaction.PracticeTransactionTest
          --require-suite dev.aymen.etaye.infrastructure.transaction.PracticeTransactionSuspensionTest
          --require-suite dev.aymen.etaye.infrastructure.web.ReadinessProbeOutageTest
          --require-suite dev.aymen.etaye.infrastructure.error.DatabaseUnavailableTest
          --require-suite dev.aymen.etaye.infrastructure.error.ProblemResponseWriterTest
          --require-suite dev.aymen.etaye.infrastructure.error.DatabaseUnavailableFilterTest
          --require-suite dev.aymen.etaye.infrastructure.idempotency.IdempotencyServiceTest
          --require-suite dev.aymen.etaye.security.CsrfRevocationFailureTest
          --require-suite dev.aymen.etaye.infrastructure.security.AccessDenialRateLimiterTest
          --require-suite dev.aymen.etaye.security.AllowedOriginHttpTest
          --require-suite dev.aymen.etaye.communications.push.PushNotificationsTest
          --require-suite dev.aymen.etaye.infrastructure.security.BrowserCorsConfigTest
          --require-suite dev.aymen.etaye.infrastructure.web.ApiMetaControllerTest
      - name: Upload Surefire reports
        if: failure() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-surefire-reports
          path: apps/api/target/surefire-reports/
          retention-days: 7
