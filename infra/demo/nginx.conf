# Patient names and birth dates travel in search query strings: the access log keeps the method and
# the path, never the arguments (story 3.1, contract: query text is never logged).
log_format etaye_private '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log etaye_private;
    # On an upstream failure nginx writes the raw request line, query string included, to the error log.
    # Only critical errors are kept: the API container's own log carries the diagnostics of a failed call.
    error_log /var/log/nginx/error.log crit;

    # The only published socket is loopback. Refuse foreign Host headers on that socket.
    if ($host !~ ^(localhost|127\.0\.0\.1)$) {
        return 421;
    }

    location = / {
        add_header Cache-Control "no-store";
        try_files /warmup.html =404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 1s;
        set $backend api;
        proxy_pass http://$backend:8080;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    location / {
        try_files $uri /index.html;
    }
}
