# Patient names and birth dates travel in search query strings: the access log keeps the method and
# the path, never the arguments (story 3.1, contract: query text is never logged).
log_format etaye_private '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log etaye_private;
    # On an upstream failure nginx writes the raw request line, query string included, to the error log.
    # Only critical errors are kept: the API container's own log carries the diagnostics of a failed call.
    error_log /var/log/nginx/error.log crit;

    # Do not emit the nginx version in the Server header (ZAP rule 10036).
    server_tokens off;

    # The only published socket is loopback. Refuse foreign Host headers on that socket.
    if ($host !~ ^(localhost|127\.0\.0\.1)$) {
        return 421;
    }

    # Security headers applied to every response from this server block.
    # - X-Frame-Options prevents the page from being embedded in a cross-origin frame (rule 10020).
    # - X-Content-Type-Options prevents MIME-type sniffing on script and style responses (rule 10021).
    # - Content-Security-Policy restricts resource loading to the same origin.
    #   The application is a React SPA: all scripts and stylesheets are served as external files from
    #   this same origin (no inline scripts, no inline event handlers, no eval). Font files are also
    #   self-hosted. The API is on the same origin under /api/. No third-party CDN, no data: URIs in
    #   the served assets. 'unsafe-inline' is not needed; 'unsafe-eval' is not needed (rule 10038).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = / {
        # Repeat the server-block security headers: nginx does not inherit add_header directives
        # from a parent block when the child block defines its own add_header directives.
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files /warmup.html =404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 1s;
        set $backend api;
        proxy_pass http://$backend:8080;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    location / {
        try_files $uri /index.html;
    }
}
