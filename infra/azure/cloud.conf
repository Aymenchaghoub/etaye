# Accommodate a full 253-character DNS name and the hash entry overhead.
map_hash_bucket_size 512;

map $host $etaye_allowed_host {
    default 0;
    include /etc/nginx/cloud-conf/allowed-hosts.inc;
}

server {
    listen 8081 default_server;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout etaye_private;
    absolute_redirect off;
    client_max_body_size 16k;

    include /etc/nginx/etaye/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    if ($etaye_allowed_host = 0) {
        return 421;
    }

    include /etc/nginx/cloud-conf/visitor-auth.inc;

    location = / {
        try_files /etaye-demo-notice.html =404;
    }

    location = /api/v1/session {
        limit_except GET POST DELETE {
            deny all;
        }
        include /etc/nginx/etaye/cloud-api.conf;
    }

    # Reuse only the clinical read surface for the shared synthetic fixture.
    location /api/ {
        limit_except GET {
            deny all;
        }
        include /etc/nginx/etaye/cloud-api.conf;
    }

    location ~ ^/api/v1/(demo|invitations|access-recovery)(/|$) {
        return 404;
    }

    location / {
        limit_except GET {
            deny all;
        }
        try_files $uri /index.html;
    }
}

# This port is only used by the platform's in-replica readiness probe.
server {
    listen 8082 default_server;
    server_name _;
    access_log off;

    location = /ready {
        proxy_pass http://127.0.0.1:8080/api/v1/meta;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    location / {
        return 404;
    }
}
