worker_processes auto;
pid /tmp/etaye-nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/etaye-client;
    proxy_temp_path /tmp/etaye-proxy;
    fastcgi_temp_path /tmp/etaye-fastcgi;
    uwsgi_temp_path /tmp/etaye-uwsgi;
    scgi_temp_path /tmp/etaye-scgi;
    log_format etaye_private '$request_method $uri $status $body_bytes_sent';

    include /etc/nginx/cloud-conf/*.conf;
}
