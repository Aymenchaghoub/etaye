services:
  postgres:
    image: postgres:18
    container_name: etaye-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etaye}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      ETAYE_OWNER_PASSWORD: ${ETAYE_OWNER_PASSWORD:?set ETAYE_OWNER_PASSWORD}
      ETAYE_RUNTIME_PASSWORD: ${ETAYE_RUNTIME_PASSWORD:?set ETAYE_RUNTIME_PASSWORD}
      ETAYE_IDENTITY_PASSWORD: ${ETAYE_IDENTITY_PASSWORD:?set ETAYE_IDENTITY_PASSWORD}
    volumes:
      - ./init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro,z
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-etaye}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
